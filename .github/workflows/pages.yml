name: Publicare pe GitHub Pages

# Cheia web Firebase nu stă în git: vine din secretul FIREBASE_API_KEY și intră în site/js/cloud/config.js doar în pachetul publicat.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md'] # documentația nu schimbă site-ul
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Teste unitare și validarea conținutului
        run: npm test

  publicare:
    needs: teste
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cheia web Firebase, din secret
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          test -n "$FIREBASE_API_KEY" || { echo "::error::Lipsește secretul FIREBASE_API_KEY"; exit 1; }
          grep -q "apiKey: ''," site/js/cloud/config.js || { echo "::error::config.js nu mai are locul gol pentru cheie"; exit 1; }
          sed -i "0,/apiKey: '',/s//apiKey: '${FIREBASE_API_KEY}',/" site/js/cloud/config.js
          grep -q "apiKey: 'AIza" site/js/cloud/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
